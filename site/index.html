<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0F1419">
    <meta name="description" content="Tarjeta de perfil de Stack con enlaces de interés.">
    <title>Stack — Links de interés</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#interest-links">Saltar a los links de interés</a>
    <main class="page-shell">
      <article class="profile-card" aria-labelledby="profile-title">
        <h1 id="profile-title" class="visually-hidden">Stack / Bryan — Arch Linux</h1>
        <picture class="terminal-preview">
          <source media="(max-width: 600px)" srcset="./assets/terminal-mobile.svg">
          <img src="./assets/terminal.svg" alt="Tarjeta de terminal de Stack: perfil, dibujo ASCII e intereses." width="880">
        </picture>

        <section class="interest-links" id="interest-links" aria-labelledby="links-title">
          <div class="section-heading">
            <span class="prompt" aria-hidden="true">~ $</span>
            <h2 id="links-title">Links de interés</h2>
          </div>

          <nav class="link-grid" aria-label="Links de interés">
            <a class="link-item" href="https://www.instagram.com/_bryan.712/">
              <svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="3" y="3" width="18" height="18" rx="5" />
                <circle cx="12" cy="12" r="4" />
                <circle class="icon-fill" cx="17.5" cy="6.8" r="1" />
              </svg>
              <span>Instagram</span>
            </a>

            <a class="link-item" href="https://psnprofiles.com/StackDS">
              <svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 3.2 16.4 4.4c2.5.7 4.1 2.5 4.1 4.8v8.4c0 1.6-1.2 2.5-2.7 1.8l-3.4-1.6v-2.1l2.5 1.2V9.1c0-1.4-.7-2.3-2.1-2.7L12 5.5v14.9l-3.1-1.1V4.1z" />
                <path d="m4 16.3 4.5-1.7v2.2l-2.8 1 .9.4 1.9-.7v2.1l-2.1.8c-.7.2-1.4.2-2.1-.1l-1.5-.7c-1.3-.6-1.2-1.6.2-2.1l4.5-1.7" />
              </svg>
              <span>PSN Profiles</span>
            </a>

            <a class="link-item" href="https://www.linkedin.com/in/bryan-aguirre-fuentes-1953642bb/?isSelfProfile=true">
              <svg class="link-icon icon-solid" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M5.2 3.2a2.1 2.1 0 1 0 0 4.2 2.1 2.1 0 0 0 0-4.2ZM3.4 9h3.7v11.8H3.4zM9.5 9h3.5v1.6h.1A3.8 3.8 0 0 1 16.5 8.7c3.8 0 4.5 2.5 4.5 5.7v6.4h-3.7v-5.7c0-1.4 0-3.2-2-3.2s-2.3 1.5-2.3 3.1v5.8H9.5z" />
              </svg>
              <span>LinkedIn</span>
            </a>

            <a class="link-item" href="#">
              <svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="3" y="8" width="18" height="12" rx="2" />
                <path d="M8 8V5.5A1.5 1.5 0 0 1 9.5 4h5A1.5 1.5 0 0 1 16 5.5V8M3 12h18M10 12v2h4v-2" />
              </svg>
              <span>Portafolio</span>
            </a>

            <button class="link-item email-button" id="copy-email" type="button">
              <svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <path d="m4 7 8 6 8-6" />
              </svg>
              <span>Correo</span>
            </button>
          </nav>

          <p class="copy-feedback" id="copy-feedback" role="status" aria-live="polite" aria-atomic="true"></p>
          <p class="manual-copy" id="manual-copy" hidden>
            No se pudo copiar. Copia esta dirección:
            <a href="mailto:stackctrlz@gmail.com">stackctrlz@gmail.com</a>
          </p>
        </section>
      </article>
      <p class="page-note"><span aria-hidden="true">//</span> Last in, first out.</p>
    </main>
  </body>
</html>
