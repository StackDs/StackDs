name: Update contribution snake

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contributions.yml'
      - 'scripts/reduce_snake_motion.py'

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'StackDs/StackDs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Generate both color themes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contributions/snake.svg?color_snake=#7255b5&color_dots=#ebedf0,#cae9eb,#86cbd0,#479da9,#256775
            assets/contributions/snake-dark.svg?palette=github-dark&color_snake=#b6a4ea&color_dots=#242c40,#304b5a,#417786,#68adba,#86dce5

      - name: Respect reduced motion
        run: python3 scripts/reduce_snake_motion.py

      - name: Save updated contribution images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions/snake.svg assets/contributions/snake-dark.svg
          if git diff --cached --quiet; then
            echo 'Contribution images are already up to date.'
            exit 0
          fi
          git commit -m "chore: update contribution snake [skip ci]"
          git push origin HEAD:main
