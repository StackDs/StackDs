<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="Algorithms &amp; Data Structures: Studying diferent algorithms and data structures, analyzing their time and space complexity, and implementing them in C++." xml:lang="en" data-motion="static">
  <title>Algorithms &amp; Data Structures</title>
  <desc>Studying diferent algorithms and data structures, analyzing their time and space complexity, and implementing them in C++.</desc>
  
  <rect x="1" y="1" width="878" height="218" rx="8" fill="#0F1419" stroke="#2B3A45" />

  
  <g font-family="DejaVu Sans Mono, Liberation Mono, monospace">
    <text x="32" y="30" font-size="11" fill="#088DDC" font-weight="bold">// BIG O COMPLEXITY</text>
    <text x="32" y="52" font-size="19" fill="#6BC5ED" font-weight="bold">Algorithms &amp; Data Structures</text>
    <text x="32" y="72" font-size="13" fill="#ECEFF4">Studying diferent algorithms and data structures,</text>
    <text x="32" y="89" font-size="13" fill="#ECEFF4">analyzing their time and space complexity, and</text>
    <text x="32" y="106" font-size="13" fill="#ECEFF4">implementing them in C++.</text>
    <rect x="32.0" y="131.0" width="52.8" height="18" rx="4" fill="#0B1117" stroke="#2B3A45" />
<text x="58.4" y="143.5" font-size="10" fill="#5C6370" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">Search</text>
    <rect x="90.8" y="131.0" width="52.8" height="18" rx="4" fill="#0B1117" stroke="#2B3A45" />
<text x="117.2" y="143.5" font-size="10" fill="#5C6370" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">Graphs</text>
    <rect x="149.6" y="131.0" width="46.0" height="18" rx="4" fill="#0B1117" stroke="#2B3A45" />
<text x="172.6" y="143.5" font-size="10" fill="#5C6370" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">Trees</text>
    <rect x="201.6" y="131.0" width="80.0" height="18" rx="4" fill="#0B1117" stroke="#2B3A45" />
<text x="241.6" y="143.5" font-size="10" fill="#5C6370" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">Complexity</text>
  </g>

  
  <g transform="translate(490, 20)">
    
    <rect width="358" height="180" rx="6" fill="#080E14" stroke="#2B3A45" />
    
    <circle cx="14" cy="13" r="3.5" fill="#EA2D2E" />
    <circle cx="25" cy="13" r="3.5" fill="#E5C07B" />
    <circle cx="36" cy="13" r="3.5" fill="#98C379" />
    <text x="50" y="17" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#5C6370">bfs_graph.py</text>
    <line x1="0" y1="26" x2="358" y2="26" stroke="#2B3A45" />

    
    
    <style>
      @keyframes bfs-n0 {
        0% { fill: #0B1117; stroke: #2B3A45; }
        10%, 92% { fill: #088DDC; stroke: #6BC5ED; }
        98%, 100% { fill: #0B1117; stroke: #2B3A45; }
      }
      @keyframes bfs-e1 {
        0%, 15% { stroke: #2B3A45; stroke-width: 1.5; }
        25%, 92% { stroke: #088DDC; stroke-width: 2.5; }
        98%, 100% { stroke: #2B3A45; stroke-width: 1.5; }
      }
      @keyframes bfs-n1 {
        0%, 20% { fill: #0B1117; stroke: #2B3A45; }
        30%, 45% { fill: #0F1419; stroke: #6BC5ED; }
        50%, 92% { fill: #088DDC; stroke: #6BC5ED; }
        98%, 100% { fill: #0B1117; stroke: #2B3A45; }
      }
      @keyframes bfs-e2 {
        0%, 45% { stroke: #2B3A45; stroke-width: 1.5; }
        55%, 92% { stroke: #088DDC; stroke-width: 2.5; }
        98%, 100% { stroke: #2B3A45; stroke-width: 1.5; }
      }
      @keyframes bfs-n2 {
        0%, 50% { fill: #0B1117; stroke: #2B3A45; }
        60%, 75% { fill: #0F1419; stroke: #6BC5ED; }
        80%, 92% { fill: #088DDC; stroke: #6BC5ED; }
        98%, 100% { fill: #0B1117; stroke: #2B3A45; }
      }
      @keyframes bfs-q0 {
        0%, 5% { opacity: 0; }
        10%, 28% { opacity: 1; }
        30%, 100% { opacity: 0; }
      }
      @keyframes bfs-q1 {
        0%, 28% { opacity: 0; }
        30%, 55% { opacity: 1; }
        58%, 100% { opacity: 0; }
      }
      @keyframes bfs-q2 {
        0%, 55% { opacity: 0; }
        58%, 85% { opacity: 1; }
        88%, 100% { opacity: 0; }
      }
      @keyframes bfs-q3 {
        0%, 85% { opacity: 0; }
        88%, 98% { opacity: 1; }
        100% { opacity: 0; }
      }
      .bq-0, .bq-1, .bq-2 { opacity: 0; }
      .bq-3 { opacity: 1; }
      .bn-0 { animation: bfs-n0 12s infinite; }
      .be-1 { animation: bfs-e1 12s infinite; }
      .bn-1 { animation: bfs-n1 12s infinite; }
      .be-2 { animation: bfs-e2 12s infinite; }
      .bn-2 { animation: bfs-n2 12s infinite; }
      .bq-0 { animation: bfs-q0 12s infinite; }
      .bq-1 { animation: bfs-q1 12s infinite; }
      .bq-2 { animation: bfs-q2 12s infinite; }
      .bq-3 { animation: bfs-q3 12s infinite; }
    </style>
    
    <g stroke="#2B3A45">
      
      <line class="be-1" x1="180" y1="46" x2="110" y2="78" />
      <line class="be-1" x1="180" y1="46" x2="250" y2="78" />
      
      <line class="be-2" x1="110" y1="78" x2="65" y2="112" />
      <line class="be-2" x1="110" y1="78" x2="145" y2="112" />
      <line class="be-2" x1="250" y1="78" x2="215" y2="112" />
      <line class="be-2" x1="250" y1="78" x2="295" y2="112" />
    </g>
    
    <g font-family="DejaVu Sans Mono, monospace" font-size="10" font-weight="bold" text-anchor="middle">
      
      <circle class="bn-0" cx="180" cy="46" r="11" fill="#0B1117" stroke="#2B3A45" stroke-width="2" />
      <text x="180" y="50" fill="#ECEFF4">0</text>
      
      <circle class="bn-1" cx="110" cy="78" r="11" fill="#0B1117" stroke="#2B3A45" stroke-width="2" />
      <text x="110" y="82" fill="#ECEFF4">1</text>
      <circle class="bn-1" cx="250" cy="78" r="11" fill="#0B1117" stroke="#2B3A45" stroke-width="2" />
      <text x="250" y="82" fill="#ECEFF4">2</text>
      
      <circle class="bn-2" cx="65" cy="112" r="10" fill="#0B1117" stroke="#2B3A45" stroke-width="2" />
      <text x="65" y="116" fill="#ECEFF4">3</text>
      <circle class="bn-2" cx="145" cy="112" r="10" fill="#0B1117" stroke="#2B3A45" stroke-width="2" />
      <text x="145" y="116" fill="#ECEFF4">4</text>
      <circle class="bn-2" cx="215" cy="112" r="10" fill="#0B1117" stroke="#2B3A45" stroke-width="2" />
      <text x="215" y="116" fill="#ECEFF4">5</text>
      <circle class="bn-2" cx="295" cy="112" r="10" fill="#0B1117" stroke="#2B3A45" stroke-width="2" />
      <text x="295" y="116" fill="#ECEFF4">6</text>
    </g>
    
    <g font-family="DejaVu Sans Mono, monospace" font-size="10" text-anchor="middle">
      <rect x="35" y="136" width="290" height="22" rx="4" fill="#0B1117" stroke="#2B3A45" />
      <text class="bq-0" x="180" y="151" fill="#088DDC">Initializing search...</text>
      <text class="bq-1" x="180" y="151" fill="#6BC5ED">Searching the best path...</text>
      <text class="bq-2" x="180" y="151" fill="#6BC5ED">Drinking a beer...</text>
      <text class="bq-3" x="180" y="151" fill="#088DDC">Yep, the liqour store is over here.</text>
    </g>

  </g>
<style id="static-motion">* { animation: none !important; } .typed-char { opacity: 1 !important; }</style></svg>
