    <path d="M 45.0,127.0 L 65.0,126.0 L 85.0,124.0 L 105.0,118.0 L 120.0,111.0 L 135.0,99.0 L 150.0,83.0 L 165.0,65.0 L 180.0,48.0 L 195.0,65.0 L 210.0,83.0 L 225.0,99.0 L 240.0,111.0 L 255.0,118.0 L 275.0,124.0 L 295.0,126.0 L 315.0,127.0 L 315.0,128 L 45.0,128 Z" fill="url(#bell-grad)" />
    
    <path class="ds-line" d="M 45.0,127.0 L 65.0,126.0 L 85.0,124.0 L 105.0,118.0 L 120.0,111.0 L 135.0,99.0 L 150.0,83.0 L 165.0,65.0 L 180.0,48.0 L 195.0,65.0 L 210.0,83.0 L 225.0,99.0 L 240.0,111.0 L 255.0,118.0 L 275.0,124.0 L 295.0,126.0 L 315.0,127.0" fill="none" stroke="#6BC5ED" stroke-width="2.5" stroke-linecap="round" />
    
