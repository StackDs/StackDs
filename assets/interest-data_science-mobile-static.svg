<svg xmlns="http://www.w3.org/2000/svg" width="420" height="360" viewBox="0 0 420 360" role="img" aria-label="Data Science: Analyzing patterns through probability distributions, mathematical modeling, and data pipelines with Python and PostgreSQL." xml:lang="en" data-motion="static">
  <title>Data Science</title>
  <desc>Analyzing patterns through probability distributions, mathematical modeling, and data pipelines with Python and PostgreSQL.</desc>
  
  <rect x="1" y="1" width="418" height="358" rx="8" fill="#0F1419" stroke="#2B3A45" />

  
  <g font-family="DejaVu Sans Mono, Liberation Mono, monospace">
    <text x="22" y="30" font-size="11" fill="#088DDC" font-weight="bold">// STATISTICS &amp; MODELING</text>
    <text x="22" y="52" font-size="19" fill="#6BC5ED" font-weight="bold">Data Science</text>
    <text x="22" y="72" font-size="12" fill="#ECEFF4">Analyzing patterns through probability</text>
    <text x="22" y="88" font-size="12" fill="#ECEFF4">distributions, mathematical modeling, and</text>
    <text x="22" y="104" font-size="12" fill="#ECEFF4">data pipelines with Python and PostgreSQL.</text>
    <rect x="22.0" y="126.0" width="86.8" height="18" rx="4" fill="#0B1117" stroke="#2B3A45" />
<text x="65.4" y="138.5" font-size="10" fill="#5C6370" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">Probability</text>
    <rect x="114.8" y="126.0" width="100.4" height="18" rx="4" fill="#0B1117" stroke="#2B3A45" />
<text x="165.0" y="138.5" font-size="10" fill="#5C6370" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">Distributions</text>
    <rect x="221.2" y="126.0" width="80.0" height="18" rx="4" fill="#0B1117" stroke="#2B3A45" />
<text x="261.2" y="138.5" font-size="10" fill="#5C6370" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">PostgreSQL</text>
    <rect x="307.2" y="126.0" width="59.6" height="18" rx="4" fill="#0B1117" stroke="#2B3A45" />
<text x="337.0" y="138.5" font-size="10" fill="#5C6370" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">Jupyter</text>
  </g>

  
  <g transform="translate(22, 175)">
    
    <rect width="376" height="170" rx="6" fill="#080E14" stroke="#2B3A45" />
    
    <circle cx="14" cy="13" r="3.5" fill="#EA2D2E" />
    <circle cx="25" cy="13" r="3.5" fill="#E5C07B" />
    <circle cx="36" cy="13" r="3.5" fill="#98C379" />
    <text x="50" y="17" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#5C6370">distribution.py</text>
    <line x1="0" y1="26" x2="376" y2="26" stroke="#2B3A45" />

    
    
    <style>
      @keyframes ds-sample {
        0%, 10% { opacity: 0.2; transform: scaleY(0.1); transform-origin: 0 128px; }
        40%, 88% { opacity: 0.85; transform: scaleY(1.0); transform-origin: 0 128px; }
        96%, 100% { opacity: 0.2; transform: scaleY(0.1); transform-origin: 0 128px; }
      }
      @keyframes ds-curve {
        0% { stroke-dashoffset: 600; opacity: 0.4; }
        35%, 88% { stroke-dashoffset: 0; opacity: 1; }
        96%, 100% { stroke-dashoffset: 0; opacity: 0.4; }
      }
      @keyframes ds-pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      .ds-bin { animation: ds-sample 6s ease-out infinite; }
      .ds-line {
        stroke-dasharray: 600;
        animation: ds-curve 6s ease-in-out infinite;
      }
      .ds-stat { animation: ds-pulse 3s ease-in-out infinite; }
    </style>
    <defs>
      <linearGradient id="bell-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#6BC5ED" stop-opacity="0.35" />
        <stop offset="100%" stop-color="#088DDC" stop-opacity="0.04" />
      </linearGradient>
    </defs>
    
