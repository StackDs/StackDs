    <line x1="35" y1="128" x2="325" y2="128" stroke="#2B3A45" stroke-width="1.5" />
    
    <g font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#5C6370" text-anchor="middle">
      <text x="95" y="140">-2σ</text>
      <text x="135" y="140">-1σ</text>
