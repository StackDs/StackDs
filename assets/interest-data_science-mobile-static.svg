      <text x="225" y="140">+1σ</text>
      <text x="265" y="140">+2σ</text>
    </g>
    
    <g class="ds-stat" font-family="DejaVu Sans Mono, monospace" font-size="9">
      <rect x="220" y="28" width="105" height="18" rx="4" fill="#0B1117" stroke="#2B3A45" />
      <text x="272" y="41" fill="#6BC5ED" text-anchor="middle">μ=0.0  σ=1.0</text>
      <rect x="35" y="28" width="100" height="18" rx="4" fill="#0B1117" stroke="#2B3A45" />
      <text x="85" y="41" fill="#D3C6AA" text-anchor="middle">P(|x|&lt;σ) ≈ 68%</text>
