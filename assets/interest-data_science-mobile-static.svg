      @keyframes ds-curve {
        0% { stroke-dashoffset: 600; opacity: 0.4; }
        35%, 88% { stroke-dashoffset: 0; opacity: 1; }
        96%, 100% { stroke-dashoffset: 0; opacity: 0.4; }
