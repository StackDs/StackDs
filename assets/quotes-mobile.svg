;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="0.750s" fill="remove"/></tspan><tspan class="typed-char" x="209.416">x<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="0.775s" fill="remove"/></tspan><tspan class="typed-char" x="217.844">t<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="0.800s" fill="remove"/></tspan></text><g class="quote" id="quote-1"><text class="quote-line" x="24" y="120" font-size="14" fill="#ECEFF4">I&#x27;m the son of rage and love<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="1.160s" fill="remove"/></text><text class="quote-line" x="24" y="142" font-size="14" fill="#6BC5ED">— St. Jimmy<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="1.320s" fill="remove"/></text></g><g class="quote" id="quote-2"><text class="quote-line" x="24" y="182" font-size="14" fill="#ECEFF4">You can&#x27;t get a hangover if you don&#x27;t stop<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="1.600s" fill="remove"/></text><text class="quote-line" x="24" y="204" font-size="14" fill="#ECEFF4">drinking<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="1.760s" fill="remove"/></text><text class="quote-line" x="24" y="226" font-size="14" fill="#6BC5ED">— Lemmy Kilmister<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="1.920s" fill="remove"/></text></g><g class="quote" id="quote-3"><text class="quote-line" x="24" y="266" font-size="14" fill="#ECEFF4">Talk is cheap. Show me the code<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="2.200s" fill="remove"/></text><text class="quote-line" x="24" y="288" font-size="14" fill="#6BC5ED">— Linus Torvalds<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="2.360s" fill="remove"/></text></g><g class="quote" id="quote-4"><text class="quote-line" x="24" y="328" font-size="14" fill="#ECEFF4">A wrong decision is better than indecision<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="2.640s" fill="remove"/></text><text class="quote-line" x="24" y="350" font-size="14" fill="#6BC5ED">— Tony Soprano<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="2.800s" fill="remove"/></text></g><g class="quote" id="quote-5"><text class="quote-line" x="24" y="390" font-size="14" fill="#ECEFF4">Yeah, Mr. White! Yeah, science!<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="3.080s" fill="remove"/></text><text class="quote-line" x="24" y="412" font-size="14" fill="#6BC5ED">— Jesse Pinkman<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="3.240s" fill="remove"/></text></g><g class="quote" id="quote-6"><text class="quote-line" x="24" y="452" font-size="14" fill="#ECEFF4">Wubba lubba dub dub!<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="3.520s" fill="remove"/></text><text class="quote-line" x="24" y="474" font-size="14" fill="#6BC5ED">— Rick Sanchez<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="3.680s" fill="remove"/></text></g><g class="quote" id="quote-7"><text class="quote-line" x="24" y="514" font-size="14" fill="#ECEFF4">What&#x27;s in the box?<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="3.960s" fill="remove"/></text><text class="quote-line" x="24" y="536" font-size="14" fill="#6BC5ED">— Se7en<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="4.120s" fill="remove"/></text></g><g class="quote" id="quote-8"><text class="quote-line" x="24" y="576" font-size="14" fill="#ECEFF4">Cadia stands, and we shall not fall<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="4.400s" fill="remove"/></text><text class="quote-line" x="24" y="598" font-size="14" fill="#6BC5ED">— Imperial Creed<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="4.560s" fill="remove"/></text></g><g class="quote" id="quote-9"><text class="quote-line" x="24" y="638" font-size="14" fill="#ECEFF4">War. War never changes.<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="4.840s" fill="remove"/></text><text class="quote-line" x="24" y="660" font-size="14" fill="#6BC5ED">— Fallout<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="5.000s" fill="remove"/></text></g><g class="quote" id="quote-10"><text class="quote-line" x="24" y="700" font-size="14" fill="#ECEFF4">Forget about Freeman<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="5.280s" fill="remove"/></text><text class="quote-line" x="24" y="722" font-size="14" fill="#6BC5ED">— Half-Life<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="5.440s" fill="remove"/></text></g><g class="quote" id="quote-11"><text class="quote-line" x="24" y="762" font-size="14" fill="#ECEFF4">The cake is a lie<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="5.720s" fill="remove"/></text><text class="quote-line" x="24" y="784" font-size="14" fill="#6BC5ED">— Portal<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="5.880s" fill="remove"/></text></g><g class="quote" id="quote-12"><text class="quote-line" x="24" y="824" font-size="14" fill="#ECEFF4">Praise the sun!<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="6.160s" fill="remove"/></text><text class="quote-line" x="24" y="846" font-size="14" fill="#6BC5ED">— Solaire of Astora<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="6.320s" fill="remove"/></text></g><g class="quote" id="quote-13"><text class="quote-line" x="24" y="886" font-size="14" fill="#ECEFF4">Would you kindly?<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="6.600s" fill="remove"/></text><text class="quote-line" x="24" y="908" font-size="14" fill="#6BC5ED">— Atlas<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="6.760s" fill="remove"/></text></g><g class="quote" id="quote-14"><text class="quote-line" x="24" y="948" font-size="14" fill="#ECEFF4">How&#x27;s your sister?<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="7.040s" fill="remove"/></text><text class="quote-line" x="24" y="970" font-size="14" fill="#6BC5ED">— Cayde-6<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="7.200s" fill="remove"/></text></g><g class="quote" id="quote-15"><text class="quote-line" x="24" y="1010" font-size="14" fill="#ECEFF4">In a world without gold, we might&#x27;ve been<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="7.480s" fill="remove"/></text><text class="quote-line" x="24" y="1032" font-size="14" fill="#ECEFF4">heroes<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="7.640s" fill="remove"/></text><text class="quote-line" x="24" y="1054" font-size="14" fill="#6BC5ED">— Blackbeard<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="7.800s" fill="remove"/></text></g><g class="quote" id="quote-16"><text class="quote-line" x="24" y="1094" font-size="14" fill="#ECEFF4">SIC PARVIS MAGNA<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="8.080s" fill="remove"/></text><text class="quote-line" x="24" y="1116" font-size="14" fill="#6BC5ED">— Sir Francis Drake<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="8.240s" fill="remove"/></text></g><g class="quote" id="quote-17"><text class="quote-line" x="24" y="1156" font-size="14" fill="#ECEFF4">Kept you waiting, huh?<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="8.520s" fill="remove"/></text><text class="quote-line" x="24" y="1178" font-size="14" fill="#6BC5ED">— Big Boss<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="8.680s" fill="remove"/></text></g><g class="quote" id="quote-18"><text class="quote-line" x="24" y="1218" font-size="14" fill="#ECEFF4">It can&#x27;t be for nothing<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="8.960s" fill="remove"/></text><text class="quote-line" x="24" y="1240" font-size="14" fill="#6BC5ED">— Ellie<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="9.120s" fill="remove"/></text></g><text class="quote-line" x="24" y="1304" font-size="14" fill="#088DDC">~ $ <animate class="reveal" attributeName="opacity" value