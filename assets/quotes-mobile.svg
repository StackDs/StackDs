<svg xmlns="http://www.w3.org/2000/svg" width="420" height="186" viewBox="0 0 420 186" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Gambling Phrase — intercepted transmissions</title>
  <desc id="desc">Talk is cheap. Show me the code — Linus Torvalds. A wrong decision is better than indecision — Tony Soprano. Wubba lubba dub dub! — Rick Sanchez. Cadia stands, and we shall not fall — Imperial Creed. War. War never changes. — Fallout. Forget about Freeman — Half-Life. The cake is a lie — Portal. Would you kindly? — Atlas. How&#x27;s your sister? — Cayde-6. SIC PARVIS MAGNA — Sir Francis Drake. Kept you waiting, huh? — Big Boss. It can&#x27;t be for nothing — Ellie. Gobernar es Educar - Pedro Aguirre Cerda.</desc>
