<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1292" viewBox="0 0 880 1292" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Hall of Fame — intercepted transmissions</title>
  <desc id="desc">I&#x27;m the son of rage and love — St. Jimmy. You can&#x27;t get a hangover if you don&#x27;t stop drinking — Lemmy Kilmister. Talk is cheap. Show me the code — Linus Torvalds. A wrong decision is better than indecision — Tony Soprano. Yeah, Mr. White! Yeah, science! — Jesse Pinkman. Wubba lubba dub dub! — Rick Sanchez. What&#x27;s in the box? — Se7en. Cadia stands, and we shall not fall — Imperial Creed. War. War never changes. — Fallout. Forget about Freeman — Half-Life. The cake is a lie — Portal. Praise the sun! — Solaire of Astora. Would you kindly? — Atlas. How&#x27;s your sister? — Cayde-6. In a world without gold, we might&#x27;ve been heroes — Blackbeard. SIC PARVIS MAGNA — Sir Francis Drake. Kept you waiting, huh? — Big Boss. It can&#x27;t be for nothing — Ellie.</desc>
  <style>
    text { font-family: 'DejaVu Sans Mono', 'Liberation Mono', monospace; font-variant-ligatures: none; }
    @media (prefers-reduced-motion: reduce) {
      .typed-char, .quote-line { opacity: 1 !important; }
      .motion { display: none; }
    }
  </style>
