"0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="0.750s" fill="remove"/></tspan><tspan class="typed-char" x="221.416">x<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="0.775s" fill="remove"/></tspan><tspan class="typed-char" x="229.844">t<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="0.800s" fill="remove"/></tspan></text><g class="quote" id="quote-1"><text class="quote-line" x="36" y="120" font-size="14" fill="#ECEFF4">I&#x27;m the son of rage and love<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="1.160s" fill="remove"/></text><text class="quote-line" x="36" y="142" font-size="14" fill="#6BC5ED">— St. Jimmy<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="1.320s" fill="remove"/></text></g><g class="quote" id="quote-2"><text class="quote-line" x="36" y="182" font-size="14" fill="#ECEFF4">You can&#x27;t get a hangover if you don&#x27;t stop drinking<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="1.600s" fill="remove"/></text><text class="quote-line" x="36" y="204" font-size="14" fill="#6BC5ED">— Lemmy Kilmister<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="1.760s" fill="remove"/></text></g><g class="quote" id="quote-3"><text class="quote-line" x="36" y="244" font-size="14" fill="#ECEFF4">Talk is cheap. Show me the code<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="2.040s" fill="remove"/></text><text class="quote-line" x="36" y="266" font-size="14" fill="#6BC5ED">— Linus Torvalds<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="2.200s" fill="remove"/></text></g><g class="quote" id="quote-4"><text class="quote-line" x="36" y="306" font-size="14" fill="#ECEFF4">A wrong decision is better than indecision<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="2.480s" fill="remove"/></text><text class="quote-line" x="36" y="328" font-size="14" fill="#6BC5ED">— Tony Soprano<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="2.640s" fill="remove"/></text></g><g class="quote" id="quote-5"><text class="quote-line" x="36" y="368" font-size="14" fill="#ECEFF4">Yeah, Mr. White! Yeah, science!<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="2.920s" fill="remove"/></text><text class="quote-line" x="36" y="390" font-size="14" fill="#6BC5ED">— Jesse Pinkman<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="3.080s" fill="remove"/></text></g><g class="quote" id="quote-6"><text class="quote-line" x="36" y="430" font-size="14" fill="#ECEFF4">Wubba lubba dub dub!<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="3.360s" fill="remove"/></text><text class="quote-line" x="36" y="452" font-size="14" fill="#6BC5ED">— Rick Sanchez<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="3.520s" fill="remove"/></text></g><g class="quote" id="quote-7"><text class="quote-line" x="36" y="492" font-size="14" fill="#ECEFF4">What&#x27;s in the box?<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="3.800s" fill="remove"/></text><text class="quote-line" x="36" y="514" font-size="14" fill="#6BC5ED">— Se7en<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="3.960s" fill="remove"/></text></g><g class="quote" id="quote-8"><text class="quote-line" x="36" y="554" font-size="14" fill="#ECEFF4">Cadia stands, and we shall not fall<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="4.240s" fill="remove"/></text><text class="quote-line" x="36" y="576" font-size="14" fill="#6BC5ED">— Imperial Creed<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="4.400s" fill="remove"/></text></g><g class="quote" id="quote-9"><text class="quote-line" x="36" y="616" font-size="14" fill="#ECEFF4">War. War never changes.<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="4.680s" fill="remove"/></text><text class="quote-line" x="36" y="638" font-size="14" fill="#6BC5ED">— Fallout<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="4.840s" fill="remove"/></text></g><g class="quote" id="quote-10"><text class="quote-line" x="36" y="678" font-size="14" fill="#ECEFF4">Forget about Freeman<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="5.120s" fill="remove"/></text><text class="quote-line" x="36" y="700" font-size="14" fill="#6BC5ED">— Half-Life<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="5.280s" fill="remove"/></text></g><g class="quote" id="quote-11"><text class="quote-line" x="36" y="740" font-size="14" fill="#ECEFF4">The cake is a lie<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="5.560s" fill="remove"/></text><text class="quote-line" x="36" y="762" font-size="14" fill="#6BC5ED">— Portal<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="5.720s" fill="remove"/></text></g><g class="quote" id="quote-12"><text class="quote-line" x="36" y="802" font-size="14" fill="#ECEFF4">Praise the sun!<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="6.000s" fill="remove"/></text><text class="quote-line" x="36" y="824" font-size="14" fill="#6BC5ED">— Solaire of Astora<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="6.160s" fill="remove"/></text></g><g class="quote" id="quote-13"><text class="quote-line" x="36" y="864" font-size="14" fill="#ECEFF4">Would you kindly?<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="6.440s" fill="remove"/></text><text class="quote-line" x="36" y="886" font-size="14" fill="#6BC5ED">— Atlas<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="6.600s" fill="remove"/></text></g><g class="quote" id="quote-14"><text class="quote-line" x="36" y="926" font-size="14" fill="#ECEFF4">How&#x27;s your sister?<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="6.880s" fill="remove"/></text><text class="quote-line" x="36" y="948" font-size="14" fill="#6BC5ED">— Cayde-6<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="7.040s" fill="remove"/></text></g><g class="quote" id="quote-15"><text class="quote-line" x="36" y="988" font-size="14" fill="#ECEFF4">In a world without gold, we might&#x27;ve been heroes<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="7.320s" fill="remove"/></text><text class="quote-line" x="36" y="1010" font-size="14" fill="#6BC5ED">— Blackbeard<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="7.480s" fill="remove"/></text></g><g class="quote" id="quote-16"><text class="quote-line" x="36" y="1050" font-size="14" fill="#ECEFF4">SIC PARVIS MAGNA<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="7.760s" fill="remove"/></text><text class="quote-line" x="36" y="1072" font-size="14" fill="#6BC5ED">— Sir Francis Drake<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="7.920s" fill="remove"/></text></g><g class="quote" id="quote-17"><text class="quote-line" x="36" y="1112" font-size="14" fill="#ECEFF4">Kept you waiting, huh?<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="8.200s" fill="remove"/></text><text class="quote-line" x="36" y="1134" font-size="14" fill="#6BC5ED">— Big Boss<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="8.360s" fill="remove"/></text></g><g class="quote" id="quote-18"><text class="quote-line" x="36" y="1174" font-size="14" fill="#ECEFF4">It can&#x27;t be for nothing<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="8.640s" fill="remove"/></text><text class="quote-line" x="36" y="1196" font-size="14" fill="#6BC5ED">— Ellie<animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="8.800s" fill="remove"/></text></g><text class="quote-line" x="36" y="1260" font-size="14" fill="#088DDC">~ $ <animate class="reveal" attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="discrete" begin="0s" dur="8.920s" fill="remove"/></text>
