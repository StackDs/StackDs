</text></g><g class="quote" id="quote-4"><text class="quote-line" x="24" y="328" font-size="14" fill="#ECEFF4">A wrong decision is better than indecision</text><text class="quote-line" x="24" y="350" font-size="14" fill="#6BC5ED">— Tony Soprano</text></g><g class="quote" id="quote-5"><text class="quote-line" x="24" y="390" font-size="14" fill="#ECEFF4">Yeah, Mr. White! Yeah, science!</text><text class="quote-line" x="24" y="412" font-size="14" fill="#6BC5ED">— Jesse Pinkman</text></g><g class="quote" id="quote-6"><text class="quote-line" x="24" y="452" font-size="14" fill="#ECEFF4">Wubba lubba dub dub!</text><text class="quote-line" x="24" y="474" font-size="14" fill="#6BC5ED">— Rick Sanchez</text></g><g class="quote" id="quote-7"><text class="quote-line" x="24" y="514" font-size="14" fill="#ECEFF4">What's in the box?</text><text class="quote-line" x="24" y="536" font-size="14" fill="#6BC5ED">— Se7en</text></g><g class="quote" id="quote-8"><text class="quote-line" x="24" y="576" font-size="14" fill="#ECEFF4">Cadia stands, and we shall not fall</text><text class="quote-line" x="24" y="598" font-size="14" fill="#6BC5ED">— Imperial Creed</text></g><g class="quote" id="quote-9"><text class="quote-line" x="24" y="638" font-size="14" fill="#ECEFF4">War. War never changes.</text><text class="quote-line" x="24" y="660" font-size="14" fill="#6BC5ED">— Fallout</text></g><g class="quote" id="quote-10"><text class="quote-line" x="24" y="700" font-size="14" fill="#ECEFF4">Forget about Freeman</text><text class="quote-line" x="24" y="722" font-size="14" fill="#6BC5ED">— Half-Life</text></g><g class="quote" id="quote-11"><text class="quote-line" x="24" y="762" font-size="14" fill="#ECEFF4">The cake is a lie</text><text class="quote-line" x="24" y="784" font-size="14" fill="#6BC5ED">— Portal</text></g><g class="quote" id="quote-12"><text class="quote-line" x="24" y="824" font-size="14" fill="#ECEFF4">Praise the sun!</text><text class="quote-line" x="24" y="846" font-size="14" fill="#6BC5ED">— Solaire of Astora</text></g><g class="quote" id="quote-13"><text class="quote-line" x="24" y="886" font-size="14" fill="#ECEFF4">Would you kindly?</text><text class="quote-line" x="24" y="908" font-size="14" fill="#6BC5ED">— Atlas</text></g><g class="quote" id="quote-14"><text class="quote-line" x="24" y="948" font-size="14" fill="#ECEFF4">How's your sister?</text><text class="quote-line" x="24" y="970" font-size="14" fill="#6BC5ED">— Cayde-6</text></g><g class="quote" id="quote-15"><text class="quote-line" x="24" y="1010" font-size="14" fill="#ECEFF4">In a world without gold, we might've been</text><text class="quote-line" x="24" y="1032" font-size="14" fill="#ECEFF4">heroes</text><text class="quote-line" x="24" y="1054" font-size="14" fill="#6BC5ED">— Blackbeard</text></g><g class="quote" id="quote-16"><text class="quote-line" x="24" y="1094" font-size="14" fill="#ECEFF4">SIC PARVIS MAGNA</text><text class="quote-line" x="24" y="1116" font-size="14" fill="#6BC5ED">— Sir Francis Drake</text></g><g class="quote" id="quote-17"><text class="quote-line" x="24" y="1156" font-size="14" fill="#ECEFF4">Kept you waiting, huh?</text><text class="quote-line" x="24" y="1178" font-size="14" fill="#6BC5ED">— Big Boss</text></g><g class="quote" id="quote-18"><text class="quote-line" x="24" y="1218" font-size="14" fill="#ECEFF4">It can't be for nothing</text><text class="quote-line" x="24" y="1240" font-size="14" fill="#6BC5ED">— Ellie</text></g><text class="quote-line" x="24" y="1304" font-size="14" fill="#088DDC">~ $ </text>
