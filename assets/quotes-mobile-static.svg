<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1336" viewBox="0 0 420 1336" role="img" aria-labelledby="title desc" xml:lang="en" data-motion="static">
  <title id="title">Hall of Fame — intercepted transmissions</title>
  <desc id="desc">I'm the son of rage and love — St. Jimmy. You can't get a hangover if you don't stop drinking — Lemmy Kilmister. Talk is cheap. Show me the code — Linus Torvalds. A wrong decision is better than indecision — Tony Soprano. Yeah, Mr. White! Yeah, science! — Jesse Pinkman. Wubba lubba dub dub! — Rick Sanchez. What's in the box? — Se7en. Cadia stands, and we shall not fall — Imperial Creed. War. War never changes. — Fallout. Forget about Freeman — Half-Life. The cake is a lie — Portal. Praise the sun! — Solaire of Astora. Would you kindly? — Atlas. How's your sister? — Cayde-6. In a world without gold, we might've been heroes — Blackbeard. SIC PARVIS MAGNA — Sir Francis Drake. Kept you waiting, huh? — Big Boss. It can't be for nothing — Ellie.</desc>
  <style>
    text { font-family: 'DejaVu Sans Mono', 'Liberation Mono', monospace; font-variant-ligatures: none; }
    @media (prefers-reduced-motion: reduce) {
      .typed-char, .quote-line { opacity: 1 !important; }
      .motion { display: none; }
    }
  </style>
