<svg xmlns="http://www.w3.org/2000/svg" width="420" height="560" viewBox="0 0 420 560" role="img" aria-labelledby="title desc">
  <title id="title">Stack / Bryan — Arch Linux</title>
  <desc id="desc">Una terminal con arte ASCII de Stack. Bryan, estudiante de Ingeniería Civil Informática en Chile. Last in, first out.</desc>
  <style>
    text { font-family: 'DejaVu Sans Mono', 'Liberation Mono', monospace; }
    .reveal { animation: type 1.8s steps(32, end) .4s both; }
    .cursor { animation: blink .8s step-end 5 forwards; }
    @keyframes type { from { width: 0; } to { width: 372px; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .reveal { animation: none; }
      .cursor { animation: none; opacity: 0; }
    }
  </style>
  <defs><clipPath id="typing"><rect class="reveal" x="24" y="0" width="372" height="560"/></clipPath></defs>
  <rect x="1" y="1" width="418" height="558" rx="12" fill="#161B2B" stroke="#3B445C"/>
  <path d="M1 45H419" stroke="#3B445C"/>
  <circle cx="25" cy="24" r="5" fill="#E9BD78"/>
  <circle cx="43" cy="24" r="5" fill="#B6A4EA"/>
  <circle cx="61" cy="24" r="5" fill="#86DCE5"/>

<text x="210.0" y="29" fill="#B7C2D9" font-size="12" text-anchor="middle">stack@arch: ~</text>
<text x="24" y="81" fill="#86DCE5" font-size="14" >~ $ fastfetch --logo stack</text>
