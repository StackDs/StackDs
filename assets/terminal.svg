<path d="M36 281H844" stroke="#3B445C"/>
<text x="36" y="314" fill="#86DCE5" font-size="14" clip-path="url(#typing)">~ $ stack.push(&quot;hello, world&quot;);</text>
<rect class="cursor" x="299" y="302" width="8" height="16" fill="#86DCE5"/>
<text x="36" y="344" fill="#E6EDF3" font-size="14" >Código, música y demasiados videojuegos.</text>
<text x="844" y="81" fill="#E9BD78" font-size="12" text-anchor="end">I use Arch, btw.</text>
