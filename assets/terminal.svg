<text x="36" y="201" fill="#86DCE5" font-size="22" xml:space="preserve"> ___) | | |/ ___ \ |___| . \ </text>
<text x="36" y="226" fill="#86DCE5" font-size="22" xml:space="preserve">|____/  |_/_/   \_\____|_|\_\ </text>
<text x="490" y="126" fill="#E6EDF3" font-size="21" font-weight="bold">Bryan / Stack</text>
<text x="490" y="159" fill="#E9BD78" font-size="14" >os</text>
<text x="542" y="159" fill="#E6EDF3" font-size="14" >Arch Linux</text>
